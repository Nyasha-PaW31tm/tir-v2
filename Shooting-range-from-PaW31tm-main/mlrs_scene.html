<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no
        "
    >

    <title>MLRS Cutscene</title>
    <link rel="stylesheet" href="mlrs_scene.css">

    

</head>


<body>

<div class="cutscene">


    <!-- =====================================================
         BACKGROUND
         ===================================================== -->

    <div class="sky"></div>

    <div class="sun"></div>

    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>

    <div class="far-mountains"></div>
    <div class="near-mountains"></div>


    <!-- =====================================================
         GROUND
         ===================================================== -->

    <div class="ground">

        <div class="ground-road"></div>

        <div class="ground-detail detail-1"></div>
        <div class="ground-detail detail-2"></div>
        <div class="ground-detail detail-3"></div>

    </div>


    <!-- =====================================================
         VEHICLE DUST
         ===================================================== -->

    <div class="movement-dust movement-dust-1"></div>
    <div class="movement-dust movement-dust-2"></div>
    <div class="movement-dust movement-dust-3"></div>


    <!-- =====================================================
         BACK MLRS
         ===================================================== -->

    <div class="mlrs mlrs-back">

        <div class="vehicle">

            <div class="vehicle-body"></div>


            <div class="cabin">

                <div class="cabin-window"></div>
                <div class="cabin-window-small"></div>

            </div>


            <div class="front-bumper"></div>


            <div class="wheel wheel-a"></div>
            <div class="wheel wheel-b"></div>
            <div class="wheel wheel-c"></div>


            <!-- LAUNCHER -->

            <div class="launcher">

                <div class="launcher-base"></div>


                <div class="launcher-frame">


                    <!-- ROCKET 1 -->

                    <div class="launcher-tube tube-1">

                        <div class="muzzle-flash"></div>

                        <div class="rocket">

                            <div class="rocket-trail"></div>

                            <div class="rocket-body"></div>

                            <div class="rocket-fin fin-top"></div>
                            <div class="rocket-fin fin-bottom"></div>

                            <div class="rocket-flame"></div>

                        </div>

                    </div>


                    <!-- ROCKET 2 -->

                    <div class="launcher-tube tube-2">

                        <div class="muzzle-flash"></div>

                        <div class="rocket">

                            <div class="rocket-trail"></div>

                            <div class="rocket-body"></div>

                            <div class="rocket-fin fin-top"></div>
                            <div class="rocket-fin fin-bottom"></div>

                            <div class="rocket-flame"></div>

                        </div>

                    </div>


                    <!-- ROCKET 3 -->

                    <div class="launcher-tube tube-3">

                        <div class="muzzle-flash"></div>

                        <div class="rocket">

                            <div class="rocket-trail"></div>

                            <div class="rocket-body"></div>

                            <div class="rocket-fin fin-top"></div>
                            <div class="rocket-fin fin-bottom"></div>

                            <div class="rocket-flame"></div>

                        </div>

                    </div>


                    <!-- ROCKET 4 -->

                    <div class="launcher-tube tube-4">

                        <div class="muzzle-flash"></div>

                        <div class="rocket">

                            <div class="rocket-trail"></div>

                            <div class="rocket-body"></div>

                            <div class="rocket-fin fin-top"></div>
                            <div class="rocket-fin fin-bottom"></div>

                            <div class="rocket-flame"></div>

                        </div>

                    </div>


                    <!-- EMPTY TUBES -->

                    <div class="launcher-tube tube-5"></div>
                    <div class="launcher-tube tube-6"></div>

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         MAIN MLRS
         ===================================================== -->

    <div class="mlrs mlrs-main">

        <div class="vehicle">

            <div class="vehicle-body"></div>


            <div class="cabin">

                <div class="cabin-window"></div>
                <div class="cabin-window-small"></div>

                <div class="door-line"></div>

            </div>


            <div class="front-bumper"></div>
            <div class="front-light"></div>


            <div class="wheel wheel-a"></div>
            <div class="wheel wheel-b"></div>
            <div class="wheel wheel-c"></div>


            <!-- LAUNCHER -->

            <div class="launcher">

                <div class="launcher-base"></div>


                <div class="launcher-frame">


                    <!-- ROCKET 1 -->

                    <div class="launcher-tube tube-1">

                        <div class="muzzle-flash"></div>

                        <div class="rocket">

                            <div class="rocket-trail"></div>

                            <div class="rocket-body"></div>

                            <div class="rocket-fin fin-top"></div>
                            <div class="rocket-fin fin-bottom"></div>

                            <div class="rocket-flame"></div>

                        </div>

                    </div>


                    <!-- ROCKET 2 -->

                    <div class="launcher-tube tube-2">

                        <div class="muzzle-flash"></div>

                        <div class="rocket">

                            <div class="rocket-trail"></div>

                            <div class="rocket-body"></div>

                            <div class="rocket-fin fin-top"></div>
                            <div class="rocket-fin fin-bottom"></div>

                            <div class="rocket-flame"></div>

                        </div>

                    </div>


                    <!-- ROCKET 3 -->

                    <div class="launcher-tube tube-3">

                        <div class="muzzle-flash"></div>

                        <div class="rocket">

                            <div class="rocket-trail"></div>

                            <div class="rocket-body"></div>

                            <div class="rocket-fin fin-top"></div>
                            <div class="rocket-fin fin-bottom"></div>

                            <div class="rocket-flame"></div>

                        </div>

                    </div>


                    <!-- ROCKET 4 -->

                    <div class="launcher-tube tube-4">

                        <div class="muzzle-flash"></div>

                        <div class="rocket">

                            <div class="rocket-trail"></div>

                            <div class="rocket-body"></div>

                            <div class="rocket-fin fin-top"></div>
                            <div class="rocket-fin fin-bottom"></div>

                            <div class="rocket-flame"></div>

                        </div>

                    </div>


                    <!-- EMPTY TUBES -->

                    <div class="launcher-tube tube-5"></div>
                    <div class="launcher-tube tube-6"></div>

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         CREW
         ===================================================== -->

    <div class="crew">


        <div class="soldier soldier-1">

            <div class="helmet"></div>
            <div class="head"></div>

            <div class="torso"></div>

            <div class="arm arm-left"></div>
            <div class="arm arm-right"></div>

            <div class="leg leg-left"></div>
            <div class="leg leg-right"></div>

        </div>


        <div class="soldier soldier-2">

            <div class="helmet"></div>
            <div class="head"></div>

            <div class="torso"></div>

            <div class="arm arm-left"></div>
            <div class="arm arm-right"></div>

            <div class="leg leg-left"></div>
            <div class="leg leg-right"></div>

        </div>


        <div class="soldier soldier-3">

            <div class="helmet"></div>
            <div class="head"></div>

            <div class="torso"></div>

            <div class="arm arm-left"></div>
            <div class="arm arm-right"></div>

            <div class="leg leg-left"></div>
            <div class="leg leg-right"></div>

        </div>


    </div>


    <!-- =====================================================
         LAUNCH SMOKE
         ===================================================== -->

    <div class="launch-effects">

        <div class="launch-smoke smoke-1"></div>
        <div class="launch-smoke smoke-2"></div>
        <div class="launch-smoke smoke-3"></div>
        <div class="launch-smoke smoke-4"></div>
        <div class="launch-smoke smoke-5"></div>

        <div class="shockwave"></div>

    </div>


    <!-- =====================================================
         CAMERA
         ===================================================== -->

    <div class="camera-flash"></div>

    <div class="vignette"></div>


</div>
<script src="mlrs_scene.js"></script>

</body>

</html>
